<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Web E‑Signature Demo (ES Modules)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 20px;
      line-height: 1.4;
    }

    h2, h3 {
      margin-top: 1.5em;
    }

    #pdfCanvas {
      border: 1px solid #ccc;
      max-width: 100%;
      display: block;
      margin-bottom: 12px;
    }

    #signatureCanvas {
      border: 2px dashed #666;
      width: 100%;
      max-width: 600px;
      height: 200px;
      touch-action: none;
      display: block;
      margin-bottom: 12px;
    }

    button {
      padding: 10px 16px;
      margin-right: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h2>Sign a PDF</h2>

  <input type="file" id="pdfInput" accept="application/pdf" />

  <h3>Document preview</h3>
  <canvas id="pdfCanvas"></canvas>

  <h3>Your signature</h3>
  <canvas id="signatureCanvas"></canvas>

  <button id="clearSig">Clear signature</button>
  <button id="signPdf" disabled>Sign &amp; download</button>

  <script type="module">
    /* ================= pdf.js ================= */
    import * as pdfjsLib from "https://unpkg.com/pdfjs-dist@4.2.67/build/pdf.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://unpkg.com/pdfjs-dist@4.2.67/build/pdf.worker.min.mjs";

    /* ================= pdf-lib ================= */
    import { PDFDocument } from "https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm";

    /* ================= signature_pad ================= */
    import SignaturePad from "https://cdn.jsdelivr.net/npm/signature_pad@4.1.5/+esm";

    const pdfInput = document.getElementById("pdfInput");
    const pdfCanvas = document.getElementById("pdfCanvas");
    const pdfCtx = pdfCanvas.getContext("2d");

    const signatureCanvas = document.getElementById("signatureCanvas");
    const signaturePad = new SignaturePad(signatureCanvas);

    let originalPdfBytes = null;

    function resizeSignatureCanvas() {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      const rect = signatureCanvas.getBoundingClientRect();

      signatureCanvas.width = rect.width * ratio;
      signatureCanvas.height = rect.height * ratio;

      const ctx = signatureCanvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      signaturePad.clear();
    }

    resizeSignatureCanvas();
    window.addEventListener("resize", resizeSignatureCanvas);

    /* ---------- Load and render PDF ---------- */
    pdfInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const buffer = await file.arrayBuffer();

      /* Immutable bytes for pdf-lib */
      originalPdfBytes = new Uint8Array(buffer);

      /* Separate copy for pdf.js */
      const pdfBytesForRendering = new Uint8Array(buffer.slice(0));

      document.getElementById("signPdf").disabled = false;

      const pdf = await pdfjsLib.getDocument({
        data: pdfBytesForRendering
      }).promise;

      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: 1.5 });

      pdfCanvas.width = viewport.width;
      pdfCanvas.height = viewport.height;

      await page.render({
        canvasContext: pdfCtx,
        viewport
      }).promise;
    });

    document.getElementById("clearSig").addEventListener("click", () => {
      signaturePad.clear();
    });

    /* ---------- Sign and download ---------- */
    document.getElementById("signPdf").addEventListener("click", async () => {
      if (!(originalPdfBytes instanceof Uint8Array)) {
        alert("PDF not loaded correctly. Please reload and try again.");
        return;
      }

      if (signaturePad.isEmpty()) {
        alert("Please provide a signature.");
        return;
      }

      try {
        const pdfDoc = await PDFDocument.load(originalPdfBytes);
        const page = pdfDoc.getPages()[2];

        const signatureImage = await pdfDoc.embedPng(
          signaturePad.toDataURL("image/png")
        );

        const { width, height } = page.getSize();

        page.drawImage(signatureImage, {
          x: width * 0.21,
          y: height * 0.80,
          width: 165,
          height: 55
        });

        page.drawText(
          `Signed on ${new Date().toLocaleString()}`,
          { x: width *0.42, height * 0.80, size: 9 }
        );

        const signedBytes = await pdfDoc.save();
        const blob = new Blob([signedBytes], { type: "application/pdf" });

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "signed-document.pdf";
        a.click();
        URL.revokeObjectURL(url);

      } catch (err) {
        console.error(err);
        alert("Failed to sign PDF. The file may be invalid.");
      }
    });
  </script>

</body>
</html>
